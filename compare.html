<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tyler Le — Local design options</title><link rel="icon" href="favicon.svg"><style>
*{box-sizing:border-box}body{min-height:100dvh;display:flex;flex-direction:column;margin:0;background:#e9e9e5;color:#262823;font:14px/1.5 system-ui,sans-serif}button,a,select{font:inherit}button,a{touch-action:manipulation}header{padding:16px 24px;background:#fafaf7;border-bottom:1px solid #c7c9c1}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}.top p{margin:4px 0 0;color:#5c6056;font-size:12px}.open{color:#344e22;text-underline-offset:4px;white-space:nowrap;padding:8px}.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px}.options{display:flex;gap:6px;flex-wrap:wrap}button{padding:9px 14px;border:1px solid #c7c9c1;border-radius:6px;background:transparent;color:inherit;cursor:pointer;min-height:42px}button[aria-pressed=true]{background:#283e25;color:#fff;border-color:#283e25}button:hover:not([aria-pressed=true]){background:#e6eadf}button:focus-visible,a:focus-visible{outline:3px solid #486f32;outline-offset:3px}.sizes{display:flex;gap:6px}#description{margin:12px 0 0;color:#53594e;font-size:13px}main{padding:20px;flex:1;min-height:650px;height:calc(100dvh - 182px)}iframe{display:block;background:white;width:100%;height:100%;margin:auto;border:0;box-shadow:0 8px 28px #18201614}main.mobile iframe{width:min(390px,100%)}@media(max-width:700px){header{padding:14px 16px}.top{align-items:flex-start}.top h1{font-size:17px}.controls{flex-direction:column;align-items:flex-start}.options{gap:5px}button{font-size:12px;padding:8px 10px}.sizes{display:none}main{padding:0;height:calc(100dvh - 270px);min-height:600px}.open{font-size:12px}.top p{max-width:32ch}#description{font-size:12px;min-height:36px}}
body{height:100dvh;min-height:0;overflow:hidden}header{flex-shrink:0}main{position:relative;flex:1;min-height:0;height:auto;margin:20px;padding:0}iframe{position:absolute;inset:0;width:100%;height:100%;margin:0}main.mobile iframe{left:50%;right:auto;transform:translateX(-50%)}@media(max-width:700px){main{margin:0;min-height:0;height:auto}}
select{border:1px solid #c7c9c1;border-radius:6px;background:#fafaf7;padding:9px 12px;color:#4d5547;min-height:42px;font-size:12px;max-width:160px}select:focus-visible{outline:3px solid #486f32;outline-offset:3px}</style></head><body><header><div class="top"><div><h1>Portfolio design options</h1><p>Local exploration · Original preserved · Nothing published</p></div><a class="open" id="open" href="options/gallery.html" target="_blank" rel="noopener">Open full page ↗</a></div><div class="controls"><div class="options" role="group" aria-label="Choose a design"><button data-option="gallery" aria-pressed="true">3D gallery</button><button data-option="kinetic" aria-pressed="false">Kinetic scroll</button><button data-option="workbench" aria-pressed="false">Post-it board</button><button data-option="chapters" aria-pressed="false">Chapters</button><button data-option="original" aria-pressed="false">Original</button></div><div class="sizes" role="group" aria-label="Preview width"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button></div></div><p id="description" role="status">A 3D gallery with a moving camera, pointer-reactive lighting, and draggable experience panels.</p></header><main><iframe src="options/gallery.html" title="3D gallery portfolio preview" id="preview"></iframe></main><script>
const options={
 gallery:{path:'options/gallery.html',text:'A 3D gallery with a moving camera, pointer-reactive lighting, and draggable experience panels.'},
 kinetic:{path:'options/kinetic.html',text:'Scroll through large moving typography and changing compositions, with every role available to explore.'},
 workbench:{path:'options/board.html',text:'An organized Post-it board with paper tilt, responsive lighting, and notes you can reorder.'},
 chapters:{path:'options/chapters.html',text:'Six sections with direct navigation, the full work history, and Clarity Networth.'},
 original:{path:'index.html',text:'The original portfolio, unchanged, for comparison.'}
};
function choose(id){const option=options[id];if(!option)return;document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===id)));document.querySelector('#preview').src=option.path;document.querySelector('#preview').title=id+' portfolio preview';document.querySelector('#open').href=option.path;document.querySelector('#description').textContent=option.text;history.replaceState(null,'','#'+id)}
document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.option)));
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('main').classList.toggle('mobile',b.dataset.size==='mobile');document.querySelectorAll('[data-size]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)))}));
choose(options[location.hash.slice(1)]?location.hash.slice(1):'gallery');
</script></body></html>
